services:
  db:
    container_name: custos_db
    image: mariadb:11.2
    restart: always
    command: --character-set-server=utf8 --collation-server=utf8_general_ci
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${CUSTOS_DB_ROOT_PASSWORD:-root}
      MARIADB_USER: admin
      MARIADB_PASSWORD: ${CUSTOS_DB_PASSWORD:-admin}
      MAX_ALLOWED_PACKET: 1073741824
    volumes:
      - ./dbinit:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  keycloak:
    container_name: custos_keycloak
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://db:3306/keycloak
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: ${CUSTOS_DB_PASSWORD:-admin}
      KC_HOSTNAME_URL: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:9001:9000"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  adminer:
    image: adminer
    restart: always
    ports:
      - "127.0.0.1:18080:8080"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/amie-service.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

  openbao:
    image: openbao/openbao:2.5.0
    container_name: openbao
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8200"
    command: server -config=/openbao/config/openbao.hcl
    cap_add:
      - IPC_LOCK
    volumes:
      - ./openbao/config:/openbao/config:ro
      - openbao-data:/openbao/file
    healthcheck:
      # sealed/uninitialized also count as up; the init job handles both
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8200/v1/sys/health?sealedcode=204&uninitcode=204&standbyok=true"]
      interval: 5s
      timeout: 3s
      retries: 30

  openbao-init:
    image: openbao/openbao:2.5.0
    container_name: openbao_init
    restart: "no"
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      BAO_ADDR: http://openbao:8200
    entrypoint: ["/bin/sh", "/init/openbao-init.sh"]
    volumes:
      - ./openbao/init:/init:ro
      - ./openbao/keys:/keys

  openldap:
    build: ./openldap
    container_name: custos_ldap
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://127.0.0.1", "-b", "dc=custos,dc=example", "-s", "base"]
      interval: 5s
      timeout: 3s
      retries: 20

  signer:
    build: ../../extensions/SSH-Certificate-Signer
    container_name: custos_signer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:8084"
    volumes:
      - ./signer/config.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
      openldap:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8084/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  signer-seed:
    image: mariadb:11.2
    container_name: custos_signer_seed
    restart: "no"
    depends_on:
      signer:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "mariadb -h db -u admin -p\"$${MARIADB_PASSWORD}\" custos_signer < /seed/seed-client.sql && echo 'signer client seeded'"]
    environment:
      MARIADB_PASSWORD: ${CUSTOS_DB_PASSWORD:-admin}
    volumes:
      - ./signer/seed-client.sql:/seed/seed-client.sql:ro

  sshd-login:
    build: ./sshd-login
    container_name: custos_sshd_login
    restart: unless-stopped
    ports:
      - "127.0.0.1:2222:22"
    environment:
      SIGNER_URL: http://signer:8084
      CLIENT_ID: custos:bench
      CLIENT_SECRET: bench-secret
    depends_on:
      signer-seed:
        condition: service_completed_successfully

volumes:
  openbao-data:
