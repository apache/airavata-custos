server:
  port: 8084
  read_timeout_seconds: 30
  write_timeout_seconds: 30
  shutdown_timeout_seconds: 30

database:
  host: db
  port: 3306
  name: custos_signer
  username: admin
  password: admin
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime_seconds: 300

vault:
  address: http://openbao:8200
  token: 00000000-0000-0000-0000-000000000000
  mount_path: ssh-ca
  timeout_seconds: 10

signer:
  ca:
    rotation:
      period_hours: 2160
      overlap_hours: 2
  policy:
    defaults:
      max_ttl_seconds: 86400
      allowed_key_types:
        - ed25519
        - rsa
        - ecdsa
  auth:
    allowed_issuers:
      - http://keycloak:8080/realms/custos
      - http://localhost:8081/realms/custos
    oidc:
      jwks_cache_ttl_seconds: 300
      jwks_max_providers: 10
      timeout_seconds: 10
  validation:
    principal_validator: noop
    cache_ttl_seconds: 300

dev_mode:
  enabled: false

cors:
  enabled: false

logging:
  level: info
  format: text
  audit_level: info

metrics:
  enabled: true
  path: /metrics
