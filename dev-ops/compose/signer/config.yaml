server:
  port: 8084
  read_timeout_seconds: 30
  write_timeout_seconds: 30
  shutdown_timeout_seconds: 30

database:
  host: db
  port: 5432
  name: custos_signer
  username: admin
  password: admin
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime_seconds: 300

vault:
  address: http://openbao:8200
  token: 00000000-0000-0000-0000-000000000000
  mount_path: ssh-ca
  timeout_seconds: 10

signer:
  reserved_usernames:
    - root
  login_host: localhost
  login_port: 2222
  ca:
    create_if_missing: true
  policy:
    max_ttl_seconds: 86400
    allowed_key_types:
      - ed25519
      - rsa
      - ecdsa
  validation:
    principal_validator: none
    cache_ttl_seconds: 300

logging:
  level: info
  format: text
