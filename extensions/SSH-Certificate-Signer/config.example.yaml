server:
  port: 8084                           # HTTP listen port
  read_timeout_seconds: 30             # HTTP read timeout
  write_timeout_seconds: 30            # HTTP write timeout
  shutdown_timeout_seconds: 30         # Graceful shutdown drain

database:
  host: localhost                      # env: DB_HOST
  port: 5432                           # env: DB_PORT
  name: custos_signer                  # env: DB_NAME
  username: admin                      # env: DB_USERNAME
  password: admin                      # env: DB_PASSWORD
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime_seconds: 300

vault:
  address: http://localhost:8200       # env: VAULT_ADDRESS
  token: root-token                    # env: VAULT_TOKEN
  mount_path: ssh-ca                   # KV v2 mount path
  timeout_seconds: 10

signer:
  service_token: ""                    # env: SIGNER_SERVICE_TOKEN. At least 32 characters.
  reserved_usernames:                  # never signed, whatever the caller asks
    - root
    - daemon
    - bin
    - sys
    - adm
    - nobody
    - sshd
    - slurm
    - munge
  login_host: login.example.org        # returned with each certificate
  login_port: 22
  ca:
    create_if_missing: false          # true creates a CA when none is stored.
    rotation:
      period_hours: 2160              # 90 days
      overlap_hours: 2
  policy:
    max_ttl_seconds: 86400            # 24 hours
    allowed_key_types:
      - ed25519
      - rsa
      - ecdsa
    denied_extensions: []             # any of the standard ssh extensions
  validation:
    principal_validator: none          # "none", or "ldap" for the site's own check
    cache_ttl_seconds: 300            # Vault credential cache TTL for validators

logging:
  level: info                          # debug, info, warn, error
  format: json                         # json or text

metrics:
  enabled: true
  path: /metrics
