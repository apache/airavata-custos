name: PAM Verify

on:
  pull_request:
    paths:
      - 'extensions/CILogon-SSH-PAM/**'
      - '.github/workflows/pam-verify.yml'
  push:
    branches: [master]
    paths:
      - 'extensions/CILogon-SSH-PAM/**'
      - '.github/workflows/pam-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    name: Build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extensions/CILogon-SSH-PAM
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make libpam0g-dev libcurl4-openssl-dev libldap-dev libgtest-dev

      - name: Build
        run: make

      - name: Tests
        run: |
          python3 test/mock_server.py &
          timeout 30 bash -c 'until (exec 3<>/dev/tcp/127.0.0.1/8042) 2>/dev/null; do sleep 1; done'
          make test
