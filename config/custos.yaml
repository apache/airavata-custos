core:
  database:
    url: "${DATABASE_DSN}"
  api:
    port: 8080
  log_level: "info"
  auth:
    oidc:
      issuer:   "${OIDC_ISSUER_URL}"
      audience: "${OIDC_AUDIENCE}"
    cache_ttl: "30s"
  users:
    # Names a user cannot choose as their cluster login.
    reserved_usernames:
      - root
      - daemon
      - bin
      - sys
      - adm
      - lp
      - sync
      - shutdown
      - halt
      - mail
      - operator
      - games
      - ftp
      - nobody
      - systemd
      - systemd-network
      - bus
      - polkitd
      - sshd
      - chrony
      - rpc
      - rpcuser
      - tss
      - slurm
      - slurmd
      - slurmdbd
      - munge
      - sssd
      - ldap
      - nscd
      - postgres
      - mysql
      - admin
      - administrator
      - ubuntu
      - centos
      - rocky
      - ec2-user
      - cloud-user
      - custos
      - docker
      - podman
      - linux
      - pgadmin

connectors:
  slurm-mapper:
    type: "slurm-association-mapper"
    enabled: true
    slurm_api:
      url: "${SLURM_API_URL}"
      version: "${SLURM_API_VERSION}"
      username: "${SLURM_API_USERNAME}"
      token: "${SLURM_TOKEN}"
    # How often the sweep re-declares associations for provisioned members.
    # This is what guarantees an association exists, so it also decides how
    # long a member waits when an event is lost or the account provisions late.
    association_reconcile_interval: "5m"
    # How long to hold a just-provisioned account back before writing its
    # association. Covers the directory export and the cluster's name cache,
    # which Custos cannot observe. Raise it if users hit "Invalid account"
    # right after being added.
    association_provision_grace: "30s"

  slurm-usage-monitor:
    type: "slurm-usage-monitor"
    enabled: true
    slurm_api:
      url: "${SLURM_API_URL}"
      version: "${SLURM_API_VERSION}"
      username: "${SLURM_API_USERNAME}"
      token: "${SLURM_TOKEN}"
    cluster_id: "${CUSTOS_CLUSTER_ID}"
    # How far back each poll re-scans to catch jobs SLURM writes to its
    # accounting database late. Tune to the cluster's slurmdbd commit lag.
    usage_lookback: "15m"

  comanage-provisioner:
    type: "comanage-identity-provisioner"
    enabled: true
    registry:
      url: "${COMANAGE_REGISTRY_URL}"
      co_id: ${COMANAGE_CO_ID}
      api_user: "${COMANAGE_API_USER}"
      api_key: "${COMANAGE_API_KEY}"
    unix_cluster:
      id: ${COMANAGE_UNIX_CLUSTER_ID}
      person_id_type: "${COMANAGE_PERSON_ID_TYPE}"
      admin_group: "${COMANAGE_CLUSTER_ADMIN_GROUP}"
    provisioning:
      custos_cluster_id: "${CUSTOS_CLUSTER_ID}"
      default_shell: "/bin/bash"
      homedir_prefix: "/home/"
      http_timeout: "30s"

  vast-provisioner:
    type: "vast-storage-provisioner"
    enabled: false
    reconcile_interval: "5m"
    clusters:
      - id: "${CUSTOS_CLUSTER_ID}"
        vast:
          url: "${VAST_VMS_URL}"
          username: "${VAST_API_USER}"
          password: "${VAST_API_PASSWORD}"
          tenant_id: ${VAST_TENANT_ID}
          view_policy: "${VAST_VIEW_POLICY}"
          view_protocols: "${VAST_VIEW_PROTOCOLS}"    # comma-separated, such as NFS,NFS4
          # Views can be shared across clusters.
          storages:
            - type: user
              view: false
            - type: project
              view: true
            - type: project_user
              view: true
            - type: project_shared
              view: true

  amie-processor:
    type: "amie-processor"
    enabled: true
    credentials:
      base_url: "${AMIE_BASE_URL}"
      site_code: "${AMIE_SITE_CODE}"
      api_key: "${AMIE_API_KEY}"
    cluster:
      id: "${AMIE_CLUSTER_ID}"
    # Maps a packet resource name to one or more catalog resources. The allocation is attached to each of them.
    # resource_aliases:
    #   my-gpu.site.access-ci.org: [gpu-a100, gpu-h100]
    #   my-cpu.site.access-ci.org: cpu-general
    resource_aliases: {}
    polling:
      poll_interval: "30s"
      worker_interval: "5s"
      poller_enabled: true
    timeouts:
      connect_timeout: "5s"
      read_timeout: "60s"

  temp-account:
    type: "temp-account"
    enabled: true

  analytics:
    type: "analytics"
    enabled: true

  email-notifier:
    type: "email-notifier"
    enabled: true
    smtp_host: "${EMAIL_SMTP_HOST}"
    smtp_port: 587
    username: "${EMAIL_SMTP_USERNAME}"
    password: "${EMAIL_SMTP_PASSWORD}"
    from: "${EMAIL_FROM}"
    support_email: "${EMAIL_SUPPORT}"
    site_name: "${EMAIL_SITE_NAME}"
    portal_url: "${EMAIL_PORTAL_URL}"
    cluster_host: "${EMAIL_CLUSTER_HOST}"
    # A square PNG. Defaults to the portal's /brand/logo/custos-mark.png.
    logo_url: "${EMAIL_LOGO_URL}"
    # Optional. A directory with custom email templates.
    templates_dir: "${EMAIL_TEMPLATES_DIR}"

  signer:
    type: "signer"
    enabled: true
    base_url: "${SIGNER_BASE_URL}"
    service_token: "${SIGNER_SERVICE_TOKEN}"
    cluster_id: "${CUSTOS_CLUSTER_ID}"
    certificate_ttl_seconds: 14400
    timeout_seconds: 10
